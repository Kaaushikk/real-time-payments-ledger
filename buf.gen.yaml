version: v2
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1]
    out: gen/go
    opt: paths=source_relative
    strategy: all
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1]
    out: gen/go
    opt: paths=source_relative
    strategy: all
  - local: [go, run, github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.24.0]
    out: gen/go
    strategy: all
    opt:
      - paths=source_relative
      - grpc_api_configuration=proto/ledger.gateway.yaml
