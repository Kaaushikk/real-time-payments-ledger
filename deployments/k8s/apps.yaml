            - {name: GRPC_ADDR, value: ":9090"}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: ledger-runtime, key: jwt-signing-key}
            - {name: JWT_ISSUER, value: "http://localhost:8081"}
            - {name: JWT_AUDIENCE, value: "ledger-api"}
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef: {name: ledger-runtime, key: kafka-brokers}
            - {name: KAFKA_TOPIC, value: "ledger.transactions"}
