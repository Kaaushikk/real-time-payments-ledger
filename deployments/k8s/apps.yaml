apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  labels: { app: ledger }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ledger }
  template:
    metadata:
      labels: { app: ledger }
    spec:
      containers:
        - name: ledger
          image: ghcr.io/beybl/realtime-payments-ledger/ledger:latest
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - secretRef: { name: ledger-secrets }
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: GRPC_ADDR
              value: ":9090"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
spec:
  selector: { app: ledger }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: { app: auth }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: ghcr.io/beybl/realtime-payments-ledger/auth:latest
          ports:
            - containerPort: 8081
            - containerPort: 9091
          envFrom:
            - secretRef: { name: ledger-secrets }
          env:
            - name: HTTP_ADDR
              value: ":8081"
            - name: GRPC_ADDR
              value: ":9091"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: { app: auth }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9091
      targetPort: 9091
