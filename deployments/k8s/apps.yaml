apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-ledger
  namespace: ledger-demo
  labels:
    app.kubernetes.io/name: payments-ledger
    app.kubernetes.io/instance: payments
    app.kubernetes.io/component: ledger
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: payments
      app.kubernetes.io/component: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-ledger
        app.kubernetes.io/instance: payments
        app.kubernetes.io/component: ledger
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ledger
          image: "payments-ledger/ledger:local-check"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
