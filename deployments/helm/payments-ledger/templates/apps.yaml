{{- $secret := required "existingSecret must name a pre-created runtime Secret" .Values.existingSecret -}}
{{- $tag := required "image.tag must identify images you have built" .Values.image.tag -}}
{{- range $name := list "ledger" "auth" "consumer" }}
{{- $http := 8080 -}}{{- $grpc := 9090 -}}
{{- if eq $name "auth" -}}{{- $http = 8081 -}}{{- $grpc = 9091 -}}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: payments-ledger
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ index $.Values.replicaCount $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-ledger
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/%s:%s" $.Values.image.registry $name $tag | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if ne $name "consumer" }}
          ports:
            - {name: http, containerPort: {{ $http }}}
            - {name: grpc, containerPort: {{ $grpc }}}
          {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: database-url}
            {{- if ne $name "consumer" }}
            - {name: HTTP_ADDR, value: {{ printf ":%d" $http | quote }}}
            - {name: GRPC_ADDR, value: {{ printf ":%d" $grpc | quote }}}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: jwt-signing-key}
            - {name: JWT_ISSUER, value: {{ $.Values.env.jwtIssuer | quote }}}
            - {name: JWT_AUDIENCE, value: {{ $.Values.env.jwtAudience | quote }}}
            {{- end }}
            {{- if eq $name "auth" }}
            - {name: AUTH_PUBLIC_URL, value: {{ $.Values.env.authPublicURL | quote }}}
            - {name: ALLOW_DEV_TOKEN, value: "false"}
            {{- else }}
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: kafka-brokers}
            - {name: KAFKA_TOPIC, value: {{ $.Values.env.kafkaTopic | quote }}}
            {{- end }}
            {{- if eq $name "consumer" }}
            - {name: KAFKA_CONSUMER_GROUP, value: {{ $.Values.env.consumerGroup | quote }}}
            {{- end }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.env.otelEndpoint | quote }}}
          resources:
            {{- toYaml (index $.Values.resources $name) | nindent 12 }}
          {{- if ne $name "consumer" }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          {{- end }}
{{- if ne $name "consumer" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: payments-ledger
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - {name: http, port: {{ $http }}, targetPort: http}
    - {name: grpc, port: {{ $grpc }}, targetPort: grpc}
{{- end }}
{{- end }}
