name: foundation-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL tests with race detector
        run: go test -race ./... -count=1 -timeout 180s -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-coverage
          path: coverage.out
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build ledger image
        run: docker build -f deployments/docker/Dockerfile --build-arg BIN=ledger -t ledger:ci .
      - name: Build auth image
        run: docker build -f deployments/docker/Dockerfile --build-arg BIN=auth -t auth:ci .
