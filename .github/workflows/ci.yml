name: foundation-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install portable deployment validators
        run: |
          bash scripts/install-deployment-tools.sh "$RUNNER_TEMP/ledger-tools"
          echo "$RUNNER_TEMP/ledger-tools" >> "$GITHUB_PATH"
          python -m pip install PyYAML==6.0.3
      - name: Check chart, Kubernetes schemas and snapshot
        run: python scripts/verify-deployment.py --output "$RUNNER_TEMP/deployment-validation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-validation
          path: ${{ runner.temp }}/deployment-validation.json
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify generated Protobuf code
        run: |
          generated="$(mktemp -d)"
          make proto PROTO_OUT="$generated"
          diff -ru gen/go "$generated/gen/go"
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL tests with race detector
        run: go test -race ./... -count=1 -timeout 180s -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-coverage
          path: coverage.out
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build ledger image
        run: docker build -f deployments/docker/Dockerfile --build-arg BIN=ledger -t ledger:ci .
      - name: Build auth image
        run: docker build -f deployments/docker/Dockerfile --build-arg BIN=auth -t auth:ci .
      - name: Build consumer image
        run: docker build -f deployments/docker/Dockerfile --build-arg BIN=consumer -t consumer:ci .
