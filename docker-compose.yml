services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host", "0.0.0.0"]
    ports:
      - "8474:8474"
      - "15432:15432"
      - "16379:16379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9093:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.2.1
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4317"
    depends_on:
      - jaeger
      - loki
      - prometheus

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  auth:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        BIN: auth
    environment:
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9091"
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      JWT_ISSUER: http://auth:8081
      JWT_AUDIENCE: ledger-api
      JWT_SIGNING_KEY: dev-only-change-me-32bytes-minimum!!
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      ALLOW_DEV_TOKEN: "true"
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy

  ledger:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      args:
        BIN: ledger
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      DATABASE_URL: postgres://ledger:ledger@toxiproxy:15432/ledger?sslmode=disable
      REDIS_ADDR: toxiproxy:16379
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ledger.transactions
      JWT_ISSUER: http://auth:8081
      JWT_AUDIENCE: ledger-api
      JWT_SIGNING_KEY: dev-only-change-me-32bytes-minimum!!
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy-config:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      auth:
        condition: service_started

  toxiproxy-config:
    image: curlimages/curl:8.11.0
    depends_on:
      - toxiproxy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://toxiproxy:8474/version; do sleep 1; done
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json' -d '{"name":"postgres","listen":"0.0.0.0:15432","upstream":"postgres:5432"}' || true
        curl -sf -X POST http://toxiproxy:8474/proxies -H 'Content-Type: application/json' -d '{"name":"redis","listen":"0.0.0.0:16379","upstream":"redis:6379"}' || true
        echo configured


volumes:
  pgdata:
